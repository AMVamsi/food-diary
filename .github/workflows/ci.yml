name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff pytest pytest-cov httpx
          if [ -f backend/requirements.lock ]; then
            pip install -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi

      - name: Ruff lint
        run: ruff check backend/app/ --config backend/pyproject.toml

      - name: Ruff format check
        run: ruff format --check backend/app/ --config backend/pyproject.toml

      - name: pytest with coverage
        run: pytest backend/tests/ --cov=backend/app --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Verify coverage report
        run: |
          if [ ! -f ./coverage.xml ]; then
            echo "ERROR: coverage.xml not found" && exit 1
          fi
          echo "coverage.xml found ($(wc -c < ./coverage.xml) bytes)"
          python3 -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage.xml').getroot()
          pct = float(root.attrib.get('line-rate', 0)) * 100
          print(f'Backend coverage: {pct:.1f}%')
          "

      - name: Check Codecov token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "ERROR: CODECOV_TOKEN secret is not set or is empty."
            echo "Fix: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: CODECOV_TOKEN  Value: copy from codecov.io → repo settings → Upload token"
            exit 1
          fi
          echo "CODECOV_TOKEN is present (${#CODECOV_TOKEN} chars)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: true

  mobile:
    name: Mobile — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd mobile && npm ci

      - name: ESLint
        run: cd mobile && npx eslint src/ --ext .ts,.tsx --max-warnings 0

      - name: Prettier check
        run: cd mobile && npx prettier --check "src/**/*.{ts,tsx}"

      - name: Jest with coverage
        run: cd mobile && npm test -- --coverage --coverageReporters=lcov

      - name: Verify and fix coverage report paths
        run: |
          if [ ! -f ./mobile/coverage/lcov.info ]; then
            echo "ERROR: mobile/coverage/lcov.info not found" && exit 1
          fi
          echo "lcov.info found ($(wc -c < ./mobile/coverage/lcov.info) bytes)"
          # lcov.info has SF:src/... paths (relative to mobile/).
          # Prefix with mobile/ so Codecov can match mobile/src/... in the repo.
          sed -i 's|^SF:src/|SF:mobile/src/|g' ./mobile/coverage/lcov.info
          echo "Sample SF paths after fix:"
          grep "^SF:" ./mobile/coverage/lcov.info | head -5

      - name: Check Codecov token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "ERROR: CODECOV_TOKEN secret is not set or is empty."
            echo "Fix: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: CODECOV_TOKEN  Value: copy from codecov.io → repo settings → Upload token"
            exit 1
          fi
          echo "CODECOV_TOKEN is present (${#CODECOV_TOKEN} chars)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: mobile
          files: ./mobile/coverage/lcov.info
          verbose: true
          fail_ci_if_error: true
