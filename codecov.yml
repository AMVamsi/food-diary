coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

flags:
  backend:
    paths:
      - backend/app/
    carryforward: true
  mobile:
    paths:
      - mobile/src/
    carryforward: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
