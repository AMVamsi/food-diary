name: AI usage disclosure check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check-ai-usage:
    name: Verify AI_USAGE.md entry exists for each commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check AI_USAGE.md entries
        run: |
          FAILED=0

          # ── Commit range ───────────────────────────────────────────────
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            # On first push to a new branch, before is all zeros
            if echo "$BEFORE" | grep -qE "^0+$"; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="$BEFORE..${{ github.sha }}"
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.action }}" = "synchronize" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            fi
          else
            RANGE="HEAD~1..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --format="%H %s" 2>/dev/null || echo "")

          if [ -z "$COMMITS" ]; then
            echo "No new commits to check."
            exit 0
          fi

          # ── Check each commit ──────────────────────────────────────────
          while IFS= read -r line; do
            [ -z "$line" ] && continue

            HASH=$(echo "$line" | awk '{print $1}')
            MSG=$(echo "$line" | cut -d' ' -f2-)

            # Auto-pass: merge commits (all variants)
            if echo "$MSG" | grep -qiE "^Merge (pull request|branch|remote|tag)"; then
              echo "OK   [$HASH]: merge commit — skipped"
              continue
            fi

            # Auto-pass: GitHub squash merge (PR title, no Merge prefix)
            # These are identified by the GitHub event context, not message content.
            # If running on a PR merge push and no slug found, treat as merge.
            if [ "${{ github.event.commits[0].message }}" = "$MSG" ] && \
               [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "OK   [$HASH]: push to main — squash merge assumed, skipped"
              continue
            fi

            # Auto-pass: Copilot code review suggestion commits
            if echo "$MSG" | grep -qiE "^Apply suggestions? from code review"; then
              echo "OK   [$HASH]: Copilot review suggestion commit — treated as [log:copilot]"
              continue
            fi

            # Auto-pass: other known GitHub-generated commit messages
            if echo "$MSG" | grep -qiE "^(Update|Co-authored-by|Revert|Bump version)"; then
              echo "OK   [$HASH]: auto-generated commit — skipped"
              continue
            fi

            # ── Normal commits: require [log:slug] ────────────────────
            SLUG=$(echo "$MSG" | grep -oE '\[log:[a-zA-Z0-9_-]+\]' | head -1 | sed 's/\[log://;s/\]//')

            if [ -z "$SLUG" ]; then
              echo "FAIL [$HASH]: no [log:slug] token — '$MSG'"
              FAILED=1
              continue
            fi

            if grep -q "| $SLUG " AI_USAGE.md; then
              echo "OK   [$HASH]: found AI_USAGE.md entry for slug '$SLUG'"
            else
              echo "FAIL [$HASH]: no AI_USAGE.md entry for slug '$SLUG'"
              FAILED=1
            fi

          done <<< "$COMMITS"

          # ── Result ────────────────────────────────────────────────────
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "One or more commits are missing AI_USAGE.md entries."
            echo "Add the missing rows to AI_USAGE.md and push a fix commit."
            exit 1
          fi

          echo ""
          echo "All commits passed the AI_USAGE.md check."