name: AI usage disclosure check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check-ai-usage:
    name: Verify AI_USAGE.md entry exists for each commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check AI_USAGE.md entries
        run: |
          FAILED=0

          # ── Commit range ──────────────────────────────────────────────
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if echo "$BEFORE" | grep -qE "^0+$"; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="$BEFORE..${{ github.sha }}"
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.action }}" = "synchronize" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            fi
          else
            RANGE="HEAD~1..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --format="%H %s" 2>/dev/null || echo "")

          if [ -z "$COMMITS" ]; then
            echo "No new commits to check."
            exit 0
          fi

          # ── Check each commit ─────────────────────────────────────────
          while IFS= read -r line; do
            [ -z "$line" ] && continue

            HASH=$(echo "$line" | awk '{print $1}')
            MSG=$(echo "$line" | cut -d' ' -f2-)

            # Auto-pass: all merge commit variants
            # Covers: PR merges, branch merges, remote merges,
            #         git internal SHA-based merges (Merge abc123 into def456)
            if echo "$MSG" | grep -qiE \
              "^Merge (pull request|branch|remote(-tracking branch)?|tag|[0-9a-f]{7,40} into)"; then
              echo "OK   [$HASH]: merge commit — skipped"
              continue
            fi

            # Auto-pass: squash merge push directly to main
            if [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.ref }}" = "refs/heads/main" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              PARENT_COUNT=$(git cat-file -p "$HASH" | grep -c "^parent " || true)
              if [ "$PARENT_COUNT" -gt 1 ]; then
                echo "OK   [$HASH]: merge commit by parent count — skipped"
                continue
              fi
            fi

            # Auto-pass: Copilot code review suggestion commits
            if echo "$MSG" | grep -qiE "^Apply suggestions? from code review"; then
              echo "OK   [$HASH]: Copilot review suggestion — skipped"
              continue
            fi

            # Auto-pass: other known GitHub-generated messages
            if echo "$MSG" | grep -qiE \
              "^(Co-authored-by|Revert \".*\"|Bump version|chore\(release\))"; then
              echo "OK   [$HASH]: auto-generated commit — skipped"
              continue
            fi

            # Auto-pass: direct file-update commits from the GitHub web editor
            # (e.g. "Update PROJECT_STATE.md", "Update README.md")
            if echo "$MSG" | grep -qiE "^Update [^ ]"; then
              echo "OK   [$HASH]: direct file update — skipped"
              continue
            fi

            # ── Require [log:slug] for all other commits ───────────────
            SLUG=$(echo "$MSG" | \
              grep -oE '\[log:[a-zA-Z0-9_-]+\]' | head -1 | \
              sed 's/\[log://;s/\]//')

            if [ -z "$SLUG" ]; then
              echo "FAIL [$HASH]: no [log:slug] token — '$MSG'"
              FAILED=1
              continue
            fi

            if grep -q "| $SLUG " AI_USAGE.md; then
              echo "OK   [$HASH]: found AI_USAGE.md entry for slug '$SLUG'"
            else
              echo "FAIL [$HASH]: no AI_USAGE.md entry for slug '$SLUG'"
              FAILED=1
            fi

          done <<< "$COMMITS"

          # ── Result ────────────────────────────────────────────────────
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "One or more commits are missing AI_USAGE.md entries."
            echo "Add the missing rows to AI_USAGE.md and push a fix commit."
            exit 1
          fi

          echo "All commits passed the AI_USAGE.md check."